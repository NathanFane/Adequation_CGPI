name: Test Morningstar

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/test_morningstar.py"
      - ".github/workflows/test_morningstar.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mstarpy
      - name: Test avec écran virtuel
        run: xvfb-run -a python scripts/test_morningstar.py
        env:
          SELENIUM_CHROME_FLAGS: "--no-sandbox --disable-dev-shm-usage"
      - name: Test en mode headless
        if: always()
        run: python scripts/test_morningstar.py
        env:
          SELENIUM_CHROME_FLAGS: "--headless=new --no-sandbox --disable-dev-shm-usage"
